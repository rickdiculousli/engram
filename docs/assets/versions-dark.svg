<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" class="dark" role="img" aria-label="In the record: a fact dated July, and a correction dated June with a revises link to it. One search returns them as one result: the correction in full, and the July version on one line marked corrected. Nothing is erased; every version is kept.">
<title>engram: a fact and its corrections</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>
<style>
svg{--fg:#e6edf3;--mu:#8b949e;--pf:#161b22;--ps:#30363d;--ed:#4a5260;--or:#ff8a2a;--or2:#ffb35a;--ort:rgba(255,138,42,.13);--ok:#3fb950;--rd:#f85149;--am:#d29922}
svg.light{--fg:#1f2328;--mu:#59636e;--pf:#f6f8fa;--ps:#d0d7de;--ed:#afb8c1;--or:#c2410c;--or2:#e8590c;--ort:rgba(232,89,12,.09);--ok:#1a7f37;--rd:#cf222e;--am:#9a6700}
text{fill:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:14px}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:13px}.s{font-size:13px}.t{font-size:17px;font-weight:600}.b{font-weight:600}
.mu{fill:var(--mu)}.or{fill:var(--or)}.ok{fill:var(--ok)}.rd{fill:var(--rd)}.am{fill:var(--am)}
.pn{fill:var(--pf);stroke:var(--ps);stroke-width:1.5}.po{fill:var(--ort);stroke:var(--or);stroke-width:1.5}
.ln{fill:none;stroke:var(--ed);stroke-width:1.5}.lo{fill:none;stroke:var(--or);stroke-width:1.5}.dash{stroke-dasharray:4 5}
.ar{marker-end:url(#ah)}.aro{marker-end:url(#aho)}#ah path{fill:var(--ed)}#aho path{fill:var(--or)}
.chip{fill:var(--pf);stroke:var(--or);stroke-width:1.2}.hl{fill:var(--ort)}
.mv{opacity:0}.mv .c{fill:var(--or)}.mv .g{fill:var(--or);opacity:.3}
.nd{fill:var(--or)}.nl{fill:var(--fg)}.nb{fill:var(--ed);stroke:var(--mu);stroke-width:1.5}.strike{stroke:var(--rd);stroke-width:1.5}
@supports not (offset-path:path('M0 0')){.mv{display:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.k1{animation:k1 8s linear infinite}@keyframes k1{0%,3.75%{opacity:0}8.12%,93.75%{opacity:1}100%{opacity:0}}.k2{animation:k2 8s linear infinite}@keyframes k2{0%,12.50%{opacity:0}16.88%,93.75%{opacity:1}100%{opacity:0}}.k3{offset-path:path('M440 125 H500');offset-rotate:0deg;animation:k3 8s ease-in-out infinite}@keyframes k3{0%,21.25%{offset-distance:0%;opacity:0}22.25%{opacity:1}28.75%{offset-distance:100%;opacity:1}31.87%,100%{offset-distance:100%;opacity:0}}.k4{animation:k4 8s linear infinite}@keyframes k4{0%,31.25%{opacity:0}35.62%,93.75%{opacity:1}100%{opacity:0}}.k5{animation:k5 8s linear infinite}@keyframes k5{0%,36.25%{opacity:0}40.62%,93.75%{opacity:1}100%{opacity:0}}.k6{animation:k6 8s linear infinite}@keyframes k6{0%,41.25%{opacity:0}45.62%,93.75%{opacity:1}100%{opacity:0}}</style>
<rect x="16" y="20" width="420" height="210" rx="10" class="pn"/>
<text x="32" y="46" class="t">in the record</text>
<g class="k1"><rect x="40" y="66" width="372" height="44" rx="8" class="pn"/><text x="56" y="93" class="s">[fact]</text><text x="396" y="93" class="m mu" text-anchor="end">07</text></g>
<g class="k2"><rect x="40" y="162" width="372" height="44" rx="8" class="po"/><text x="56" y="189" class="s">[correction]</text><text x="396" y="189" class="m or" text-anchor="end">06</text><path d="M96 160 V114" class="lo aro"/><text x="108" y="142" class="m or">revises</text></g>
<path d="M440 125 H500" class="ln ar"/>
<text x="470" y="115" class="s mu" text-anchor="middle">search</text>
<g class="mv k3"><circle r="9" class="g"/><circle r="4.5" class="c"/></g>
<rect x="504" y="20" width="440" height="210" rx="10" class="pn"/>
<text x="520" y="46" class="t">one result</text>
<text x="520" y="66" class="m mu">engram search "[question]"</text>
<g class="k4"><rect x="520" y="86" width="408" height="44" rx="8" class="po"/><text x="536" y="113" class="s b">[correction]</text><text x="912" y="113" class="m or" text-anchor="end">06</text></g>
<g class="k5"><text x="536" y="158" class="m mu">07</text><text x="564" y="158" class="m mu">[fact]</text><text x="624" y="158" class="s mu">→ corrected</text></g>
<g class="k6"><text x="520" y="206" class="s mu">nothing erased · every version kept</text></g>
</svg>
