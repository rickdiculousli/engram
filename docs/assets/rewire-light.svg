<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" class="light" role="img" aria-label="Rewiring: a repo starts as a tangle of records. What you want it to do decides its shape: follow each thing becomes a page per name with spokes to its records; keep what happened becomes entries on a thread; sort by category becomes a group per category. The shape is kept in .engram/engram.toml, and a commit that drifts from it is refused.">
<title>engram: rewiring a repo</title>
