<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" class="light" role="img" aria-label="The hourly filer waits an hour for a session to settle, then files from one message, 'picked about 3 kg of Sungold this week, the Brandywine are slow', said on 2026-09-28. The model proposes four facts and code checks each: the quote is in the owner's words, every number is theirs, the date is one they gave, and it isn't a repeat. 'About 3 kg of Sungold picked this week' passes and is filed. '5 kg of Sungold picked' is dropped: 5 isn't in their words. 'Brandywine slow to ripen' dated 2026-09-21 is filed with its date narrowed to 2026-09. 'Brandywine and Sungold in the north bed' is dropped as a repeat of an entry already filed.">
<title>engram: the filer's guards</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>
<style>
