[project]
name = "engram"
version = "0.1.0"
description = "The memory Claude works from: a store and search layer over record repos"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
engram = "engram.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
