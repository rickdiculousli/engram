# A made-up inner-work record: one person's sessions with a guide, on how he goes quiet. Engram's tests for an
# inner-work area run against it; every line of it is invented. The tables after the line below are the settings the
# inner-work changes build to (docs/technical.md, "The inner-work settings"): engram doesn't read them yet.
[domain]
name = "inner-work"
events_dir = "events"
commit = "per-write"
push = true

[index]
events = true
exclude = ["events/", "gym/"]  # entries are indexed as themselves; the gym app's rows through the pack's reader

[about]
prefixes = ["theme", "person", "event", "practice"]

[links.timeline]
rels = ["led-to", "joined-into", "split-into", "ended"]
[links.theory]
rels = ["feeds", "under"]  # a loop's steps; a belief under a broader one
[links.evidence]
rels = ["revises", "supersedes", "corrects"]  # an entry correcting a note corrects it

[ways.treatment]
entities = "practice"  # a practice is a way in by its name

[refine]
paused = true  # the weekly pass waits for its own spec here

[rewire]
at = "51c05745a8ffb6c6452d7e4c1260a9039174408b"
homes = {"events/" = "what was said, one entry each", "notes/" = "each working session, one note each", "theory/" = "beliefs, parts, insights and the loop"}

[sessions]
pause = 20  # minutes: a silence this long ends a session, and a session is saved once it has been over this long

[notes]  # change 4: a working session is saved as one note in the repo
folder = "notes"
line_words = 40  # a longer line of the guide's is kept by its opening words; the owner's are whole
stopped = "where you stopped"  # change 8: the section a chat starts with
sections = [
    {name = "what you brought", by = ["owner"]},
    {name = "what was done", by = ["guide"]},
    {name = "what you found", by = ["owner"]},
    {name = "what changed", by = ["owner"]},
    {name = "where you stopped", by = ["owner", "guide unanswered"]},
]

[threads]  # what the filer may create, named only with the owner's words
create = ["theme", "person", "event"]

[theory.kinds.belief]  # the record's own theory kinds, beside node, state and loop
folder = "theory/beliefs"
[theory.kinds.part]
folder = "theory/parts"
[theory.kinds.insight]
folder = "theory/insights"
stages = ["noticed", "trying", "living it"]  # how far along the change is, beside how sure it is
needs_note = true  # one is added only from a session with a note, which it names

[suggestions]  # the guide's ideas, kept as the guide's where the pack has `suggest` words
quiet_days = 30  # one the owner hasn't spoken of for this long leaves the picture a chat starts with

[links.moment]  # change 9: how a moment links to the theory, in place of strengthens and weakens
skip_kinds = ["practice"]  # never sent to the linking job; the guide's suggestions never are
hourly = true  # the linking job runs in the hourly job, whatever [refine] says
[links.moment.rels.showed-up]
label = "showed up"
means = "the belief, loop or part was active in this moment"
to = ["belief", "part", "loop"]
[links.moment.rels.set-off-by]
label = "set off by"
means = "what triggered it: what happened that set it off, in a passage of that alone; the words in which it speaks (saying it, saying it's so, expecting what it expects) are it showing up, never what set it off"
to = ["belief", "part", "loop"]
[links.moment.rels.did-differently]
label = "did differently"
means = "Sam stepped out of the old pattern here"
to = ["belief", "part", "loop", "insight"]
[links.moment.rels.didnt-fit]
label = "didn't fit"
means = "what happened is not what the belief expects"
to = ["belief"]
[links.moment.rels.eased]
label = "eased"
means = "its grip loosened, as Sam says himself"
to = ["belief", "part", "loop", "insight"]
owner_words = true  # only on a passage of Sam's own words

[beliefs]  # what Sam says about himself, kept as a trail
kind = "stated-belief"  # the entry kind it's saved as
belief = "belief"  # the theory kind a statement links to: a group of statements that say nearly the same thing
rel = "showed-up"  # the moment link kind it links by
under = "under"  # the theory link that puts a belief under a broader one

# ---- Not yet read by engram: the inner-work settings ----

[app]  # change 10: what the pack's `gym` reader passes as the owner's own words
kind = "practice-note"
