<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" class="light" role="img" aria-label="The loop. Keep: you tell Claude something in a session; the hourly filer checks it is knowledge, three checks, then writes it as the latest entry and commits and pushes it. The index, your records linked as a graph, takes it in. Find: you ask a question; one call lights its match in the graph and what links to it, returns them in time order, and Claude answers from them.">
<title>engram: keep and find</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>
<style>
